[project]
name = "pyBROTlib"
version = "1.6.0"
description = "MQTT interface to BROT telescopes"
readme = "README.md"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }, { name = "Lukas Melzig", email = "lukas.melzig@stud.uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiomqtt>=2.4.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0,<27",
    "ruff>=0.15.16",
    "pyrefly>=1.1.1",
    "pre-commit>=4.2.0,<5",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G", "ANN"]  # G catches the logging format issues

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
